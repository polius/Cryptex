openapi: 3.1.0
info:
  title: Cryptex API
  version: "3.0.0"
  summary: Blind, two-way secret sharing. Every value the server could read is ciphertext or a hash.
  description: |
    Base path `/api/v1`. JSON unless stated. Times are ISO 8601 UTC.

    **Authorization model** (see permissions.md). Capability tokens travel in the `Authorization` header
    with a scheme name that says what they are: `Reveal`, `Upload`, `Manage`, `Answer`, `Read`, or `Bearer`
    for personal API tokens. Signed-in browsers use the `cx_session` cookie (HttpOnly, Secure, SameSite=Lax)
    plus the `X-CSRF` header on unsafe methods.

    **404 rule.** If the caller can't prove they hold the link (wrong or missing capability token, unknown ID),
    the response is always `404 not_found`, byte-for-byte identical. `410 gone` is only returned with a valid token.

    Crypto formats are defined in crypto-v1.md; this file only describes transport.
servers:
  - url: /api/v1
tags:
  - {name: Config}
  - {name: Secrets, description: Send flow and recipient flow}
  - {name: Receipts, description: "Sender-side status and live updates"}
  - {name: Requests, description: Asking for a secret}
  - {name: Auth}
  - {name: Setup}
  - {name: Server, description: Owner-only administration}
  - {name: Tokens}
  - {name: Health}

components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: cx_session}
    bearer: {type: http, scheme: bearer, description: "Personal API token `cx_live_…`"}
    reveal: {type: apiKey, in: header, name: Authorization, description: "`Reveal <b64u(reveal_token)>`"}
    upload: {type: apiKey, in: header, name: Authorization, description: "`Upload <token>` from create"}
    manage: {type: apiKey, in: header, name: Authorization, description: "`Manage <token>` from create"}
    answer: {type: apiKey, in: header, name: Authorization, description: "`Answer <b64u(answer_token)>`"}
    read: {type: apiKey, in: header, name: Authorization, description: "`Read <session>` from reveal, valid 10 minutes"}
  parameters:
    Id: {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    Stream: {name: stream, in: path, required: true, schema: {type: integer, minimum: 0}}
    N: {name: n, in: path, required: true, schema: {type: integer, minimum: 0}}
  headers:
    RetryAfter: {schema: {type: integer}, description: Seconds until the limit resets}
  responses:
    NotFound:
      description: Unknown ID, wrong or missing token, unknown route. Always identical.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}, example: {error: {code: not_found, message: "Not found."}}}}
    Gone:
      description: Valid token, but the secret or request was opened, expired, destroyed or cancelled.
      content: {application/json: {schema: {$ref: '#/components/schemas/Gone'}}}
    Invalid:
      description: Validation failed or a limit was exceeded.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}, example: {error: {code: limit_exceeded, message: "Files can be up to 100 MB.", field: "streams[1].size", limit: 104857600}}}}
    SignIn:
      description: The server requires sign-in for this action.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Forbidden:
      description: Signed in, but not allowed (for example, not an owner), or re-authentication needed.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    RateLimited:
      description: Too many requests.
      headers: {Retry-After: {$ref: '#/components/headers/RetryAfter'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}, example: {error: {code: rate_limited, message: "Try again in 3 h 12 min.", reset_at: "2026-10-28T00:00:00Z"}}}}
    TooLarge:
      description: Chunk or total size over the limit.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Conflict:
      description: Already sealed, already answered, or setup already done.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NoContent: {description: Done}
  schemas:
    Id: {type: string, pattern: '^[0-9A-Za-z]{10}$', examples: [k7Qp2vR9mL]}
    B64u: {type: string, pattern: '^[A-Za-z0-9_-]*$'}
    Hex64: {type: string, pattern: '^[0-9a-f]{64}$'}
    Time: {type: string, format: date-time}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid, limit_exceeded, sign_in_required, forbidden, reauth_required, code_required, wrong_code,
                     not_found, already_sealed, already_answered, setup_done, gone, too_large, wrong_passphrase,
                     rate_limited, demo_locked, internal]
            message: {type: string, description: "Human-readable text from the copy deck"}
            field: {type: string}
            limit: {type: integer}
            tries_left: {type: integer}
            reset_at: {$ref: '#/components/schemas/Time'}
    Gone:
      type: object
      properties:
        error:
          type: object
          properties:
            code: {const: gone}
            message: {type: string}
            reason: {type: string, enum: [opened, expired, destroyed, cancelled, answered, too_many_tries]}
            at: {$ref: '#/components/schemas/Time'}
    Policy:
      type: object
      required: [views, expires_in, access]
      properties:
        views: {type: integer, minimum: 1, description: Opens allowed}
        expires_in: {type: integer, minimum: 300, description: Seconds}
        access: {type: string, enum: [link, email, org]}
        email: {type: string, format: email, description: Required when access is email. Stored encrypted with ENC_KEY.}
        passphrase: {type: boolean}
        passphrase_salt: {$ref: '#/components/schemas/B64u'}
        notify: {type: boolean, description: Email the signed-in sender when opened}
    StreamDesc:
      type: object
      required: [stream, prefix, chunks, size]
      properties:
        stream: {type: integer, minimum: 0}
        prefix: {$ref: '#/components/schemas/B64u', description: 7-byte STREAM nonce prefix}
        chunks: {type: integer, minimum: 1}
        size: {type: integer, minimum: 0, description: Total ciphertext bytes}
    Config:
      type: object
      properties:
        version: {type: string}
        mode: {type: string, enum: [anyone, signed_in]}
        demo: {type: boolean}
        signed_in: {type: boolean}
        user: {$ref: '#/components/schemas/User'}
        brand: {$ref: '#/components/schemas/Brand'}
        limits:
          type: object
          properties:
            max_expires_in: {type: integer}
            max_views: {type: integer}
            max_message_chars: {type: integer}
            max_files: {type: integer}
            max_file_bytes: {type: integer}
            request_max_expires_in: {type: integer}
        defaults: {$ref: '#/components/schemas/Policy'}
        features:
          type: object
          properties:
            email_access: {type: boolean, description: SMTP configured}
            org_access: {type: boolean, description: OIDC configured}
            notify: {type: boolean}
        quota:
          type: object
          description: Present in demo mode and for anonymous senders
          properties: {used: {type: integer}, limit: {type: integer}, reset_at: {$ref: '#/components/schemas/Time'}}
    Brand:
      type: object
      properties:
        name: {type: string, maxLength: 40}
        logo_url: {type: string}
        public_url: {type: string, format: uri}
    User:
      type: object
      properties:
        id: {type: string}
        email: {type: string, format: email}
        name: {type: string}
        role: {type: string, enum: [member, owner]}
        mfa: {type: boolean}
    Event:
      type: object
      required: [type, at]
      properties:
        type: {type: string, description: "See events.md, e.g. secret.revealed"}
        at: {$ref: '#/components/schemas/Time'}
        detail: {type: object, additionalProperties: true}
    Receipt:
      type: object
      properties:
        id: {$ref: '#/components/schemas/Id'}
        kind: {type: string, enum: [secret, request]}
        status: {type: string, enum: [waiting, opened, answered, revealed, expired, destroyed, cancelled]}
        views_left: {type: integer}
        expires_at: {$ref: '#/components/schemas/Time'}
        events: {type: array, items: {$ref: '#/components/schemas/Event'}}
    Token:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        owner: {$ref: '#/components/schemas/User'}
        scopes: {type: array, items: {type: string, enum: [send, request]}}
        created_at: {$ref: '#/components/schemas/Time'}
        expires_at: {$ref: '#/components/schemas/Time'}
        last_used_at: {$ref: '#/components/schemas/Time'}
        hint: {type: string, examples: ["cx_live_…7Q2a"]}

paths:
  /config:
    get:
      tags: [Config]
      summary: Limits, defaults, features, brand and quota for the current visitor
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Config'}}}}

  /secrets:
    post:
      tags: [Secrets]
      summary: Create a secret (step 1 of 3). Screens A3–A4.
      security: [{}, {session: []}, {bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy, streams]
              description: |
                Values that depend on the ID (meta_ct, reveal_hash, passcheck_hash) can't exist before the server
                assigns it, so they are sent with seal. Stream sizes are known up front: size = plaintext + 16 × chunks.
              properties:
                policy: {$ref: '#/components/schemas/Policy'}
                streams: {type: array, minItems: 1, items: {$ref: '#/components/schemas/StreamDesc'}}
      responses:
        '201':
          description: Created; upload chunks next
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {$ref: '#/components/schemas/Id'}
                  upload_token: {type: string}
                  manage_token: {type: string}
                  expires_at: {$ref: '#/components/schemas/Time'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/SignIn'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /secrets/{id}/chunks/{stream}/{n}:
    parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/Stream'}, {$ref: '#/components/parameters/N'}]
    put:
      tags: [Secrets]
      summary: Upload one encrypted chunk (step 2). Idempotent; re-sending the same chunk is allowed until sealed.
      security: [{upload: []}]
      requestBody: {required: true, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
    get:
      tags: [Secrets]
      summary: Download one encrypted chunk during a read session. Screen D4.
      security: [{read: []}]
      responses:
        '200': {description: Chunk bytes, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '404': {$ref: '#/components/responses/NotFound'}

  /secrets/{id}/seal:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Secrets]
      summary: Finalize (step 3). Checks every declared chunk arrived and stores the ID-bound values. The upload token stops working.
      security: [{upload: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meta_ct, reveal_hash]
              properties:
                meta_ct: {$ref: '#/components/schemas/B64u'}
                reveal_hash: {$ref: '#/components/schemas/Hex64'}
                passcheck_hash: {$ref: '#/components/schemas/Hex64', description: Required exactly when policy.passphrase is true}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/Invalid'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /secrets/{id}/upload:
    parameters: [{$ref: '#/components/parameters/Id'}]
    delete:
      tags: [Secrets]
      summary: Cancel an unsealed upload and delete its chunks. Screen A4.
      security: [{upload: []}]
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/NotFound'}

  /secrets/{id}/meta:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Secrets]
      summary: Read-only metadata for the sealed page. Changes nothing. Screens D1–D3, D5.
      security: [{reveal: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta_ct: {$ref: '#/components/schemas/B64u'}
                  views_left: {type: integer}
                  expires_at: {$ref: '#/components/schemas/Time'}
                  access: {type: string, enum: [link, email, org]}
                  email_hint: {type: string, examples: ["l•••@globex.example"]}
                  org_name: {type: string}
                  passphrase: {type: boolean}
                  passphrase_salt: {$ref: '#/components/schemas/B64u'}
                  tries_left: {type: integer}
                  size: {type: integer}
                  files: {type: integer}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}

  /secrets/{id}/verify/start:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Secrets]
      summary: Email a 6-digit code to the allowed address. Screen D2.
      security: [{reveal: []}]
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /secrets/{id}/verify:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Secrets]
      summary: Check the code; returns an access grant valid 10 minutes. 5 wrong codes destroy the secret.
      security: [{reveal: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [code], properties: {code: {type: string, pattern: '^[0-9]{6}$'}}}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {grant: {type: string}}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}

  /secrets/{id}/reveal:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Secrets]
      summary: Count a view and open a 10-minute read session. Screen D4.
      description: |
        Order of checks: reveal token → access rule (grant header for email, session for org) → passcheck.
        When this view uses the last one, the secret becomes unrevealable immediately and its chunks are deleted
        when the read session ends (all chunks fetched, or 10 minutes, whichever comes first).
      security: [{reveal: []}]
      parameters:
        - {name: X-Passcheck, in: header, schema: {type: string}, description: b64u(passcheck) when a passphrase is set}
        - {name: X-Access-Grant, in: header, schema: {type: string}, description: From /verify for email-only secrets}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  read_session: {type: string}
                  streams: {type: array, items: {$ref: '#/components/schemas/StreamDesc'}}
                  views_left: {type: integer}
        '401': {$ref: '#/components/responses/SignIn'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        '422':
          description: Wrong passphrase
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}, example: {error: {code: wrong_passphrase, message: "That passphrase didn’t work.", tries_left: 4}}}}

  /secrets/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    delete:
      tags: [Secrets]
      summary: Destroy now. Screen A6.
      security: [{manage: []}]
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/NotFound'}

  /secrets/{id}/read:
    parameters: [{$ref: '#/components/parameters/Id'}]
    delete:
      tags: [Secrets]
      summary: The recipient decrypted everything. Ends the read session; on the last view, deletes the data now (otherwise after a 60-second retry grace).
      security: [{read: []}]
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/NotFound'}

  /secrets/{id}/report:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Secrets]
      summary: DEMO=true only. Anyone holding the link takes it down as abuse.
      security: [{reveal: []}]
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/NotFound'}

  /receipts/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Receipts]
      summary: Status and events for one secret or request. Screen B2.
      security: [{manage: []}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Receipt'}}}}
        '404': {$ref: '#/components/responses/NotFound'}

  /receipts/lookup:
    post:
      tags: [Receipts]
      summary: Batch status for Your links (up to 200 items). Screen B1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items: {type: array, maxItems: 200, items: {type: object, required: [id, manage_token], properties: {id: {$ref: '#/components/schemas/Id'}, manage_token: {type: string}}}}
      responses:
        '200': {description: Unknown or wrong pairs are silently omitted, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Receipt'}}}}}}}

  /receipts/subscribe:
    post:
      tags: [Receipts]
      summary: Exchange manage tokens for a 1-hour ticket, because EventSource can’t send headers.
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {items: {type: array, maxItems: 200, items: {type: object, properties: {id: {type: string}, manage_token: {type: string}}}}}}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {ticket: {type: string}, expires_in: {type: integer}}}}}}

  /receipts/events:
    get:
      tags: [Receipts]
      summary: Server-Sent Events for subscribed items. See events.md for the event format.
      parameters: [{name: ticket, in: query, required: true, schema: {type: string}}]
      responses:
        '200': {description: text/event-stream, content: {text/event-stream: {schema: {type: string}}}}
        '404': {$ref: '#/components/responses/NotFound'}

  /me/receipts:
    get:
      tags: [Receipts]
      summary: Receipts synced to the signed-in account (statuses only; link keys never leave the device)
      security: [{session: []}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Receipt'}}}}}}}
    post:
      tags: [Receipts]
      summary: Attach a receipt (id + manage token) to the account so other devices see its status
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [id, manage_token, kind], properties: {id: {type: string}, manage_token: {type: string}, kind: {type: string, enum: [secret, request]}}}}}}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}

  /requests:
    post:
      tags: [Requests]
      summary: Create a request. Screen C1.
      security: [{}, {session: []}, {bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key, expires_in, keep_answer_s]
              properties:
                public_key: {$ref: '#/components/schemas/B64u', description: SPKI DER of the requester's P-256 key}
                expires_in: {type: integer}
                keep_answer_s: {type: integer}
                files: {type: boolean}
                notify: {type: boolean}
      responses:
        '201': {description: "Created; seal next with prompt_ct and answer_token_hash", content: {application/json: {schema: {type: object, properties: {id: {$ref: '#/components/schemas/Id'}, manage_token: {type: string}, upload_token: {type: string, description: "One-time token for /requests/{id}/seal"}, expires_at: {$ref: '#/components/schemas/Time'}}}}}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/SignIn'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /requests/{id}/seal:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Requests]
      summary: Store the ID-bound values. Until sealed, the prompt is 404.
      security: [{upload: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [prompt_ct, answer_token_hash], properties: {prompt_ct: {$ref: '#/components/schemas/B64u'}, answer_token_hash: {$ref: '#/components/schemas/Hex64'}}}}}}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /requests/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    delete:
      tags: [Requests]
      summary: Cancel the request, or destroy a received answer. Screen C2.
      security: [{manage: []}]
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/NotFound'}

  /requests/{id}/prompt:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Requests]
      summary: What the responder sees. Screen C3.
      security: [{answer: []}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {public_key: {type: string}, prompt_ct: {type: string}, files: {type: boolean}, expires_at: {$ref: '#/components/schemas/Time'}, limits: {type: object}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}

  /requests/{id}/answer:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Requests]
      summary: Start an answer; returns an upload token. One answer per request.
      security: [{answer: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [ephemeral_key, streams], properties: {ephemeral_key: {type: string}, streams: {type: array, items: {$ref: '#/components/schemas/StreamDesc'}}}}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {type: object, properties: {upload_token: {type: string}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
    get:
      tags: [Requests]
      summary: Answer descriptor for the requester. Screen B1 → reveal answer.
      security: [{manage: []}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {ephemeral_key: {type: string}, streams: {type: array, items: {$ref: '#/components/schemas/StreamDesc'}}, answered_at: {$ref: '#/components/schemas/Time'}, kept_until: {$ref: '#/components/schemas/Time'}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}

  /requests/{id}/answer/chunks/{stream}/{n}:
    parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/Stream'}, {$ref: '#/components/parameters/N'}]
    put:
      tags: [Requests]
      summary: Upload an answer chunk
      security: [{upload: []}]
      requestBody: {required: true, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    get:
      tags: [Requests]
      summary: Download an answer chunk (requester)
      security: [{manage: []}]
      responses:
        '200': {description: Chunk bytes, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '404': {$ref: '#/components/responses/NotFound'}

  /requests/{id}/answer/seal:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Requests]
      summary: Finalize the answer; notifies the requester. Screen C4.
      security: [{upload: []}]
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/NotFound'}

  /auth/session:
    get:
      tags: [Auth]
      summary: Current user or null; also returns a CSRF token
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {user: {oneOf: [{$ref: '#/components/schemas/User'}, {type: 'null'}]}, csrf: {type: string}}}}}}
  /auth/oidc/start:
    get:
      tags: [Auth]
      summary: Redirect to the identity provider. Screen F2.
      parameters: [{name: return_to, in: query, schema: {type: string}, description: Same-origin path only}]
      responses: {'302': {description: Redirect}}
  /auth/oidc/callback:
    get:
      tags: [Auth]
      summary: Provider callback; creates the session
      responses: {'302': {description: Redirect to return_to}}
  /auth/login:
    post:
      tags: [Auth]
      summary: Owner password sign-in, step 1
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [email, password], properties: {email: {type: string}, password: {type: string}}}}}}
      responses:
        '200': {description: TOTP needed, content: {application/json: {schema: {type: object, properties: {mfa_ticket: {type: string}}}}}}
        '401': {description: Wrong email or password (same message for both)}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/login/totp:
    post:
      tags: [Auth]
      summary: Owner password sign-in, step 2
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [mfa_ticket, code], properties: {mfa_ticket: {type: string}, code: {type: string}}}}}}
      responses:
        '204': {description: Session cookie set}
        '401': {description: Wrong code}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/reauth:
    post:
      tags: [Auth]
      summary: Confirm identity for 5 minutes before sensitive changes (password, 2FA, access, tokens)
      security: [{session: []}]
      requestBody: {content: {application/json: {schema: {type: object, properties: {password: {type: string}, code: {type: string}}}}}}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {description: Wrong password or code}
  /auth/logout:
    post:
      tags: [Auth]
      security: [{session: []}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}

  /setup:
    get:
      tags: [Setup]
      summary: Whether first-run setup is needed, and the current step. Screen F1.
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {needed: {type: boolean}, step: {type: integer, enum: [1, 2, 3]}, detected_url: {type: string}, https: {type: boolean}}}}}}
  /setup/owner:
    post:
      tags: [Setup]
      summary: Step 1. Requires the one-time SETUP_CODE printed in the server log, so nobody else can claim a fresh install.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [setup_code, email, name], properties: {setup_code: {type: string}, email: {type: string}, name: {type: string}, password: {type: string, minLength: 12}, totp_secret: {type: string}, totp_code: {type: string}, oidc: {type: boolean}}}}}}
      responses:
        '204': {description: Owner created and signed in}
        '400': {$ref: '#/components/responses/Invalid'}
        '409': {$ref: '#/components/responses/Conflict'}
  /setup/brand:
    post:
      tags: [Setup]
      summary: Step 2
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Brand'}}}}
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /setup/access:
    post:
      tags: [Setup]
      summary: Step 3; finishes setup
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {mode: {type: string, enum: [anyone, signed_in]}}}}}}
      responses: {'204': {$ref: '#/components/responses/NoContent'}}

  /server/overview:
    get:
      tags: [Server]
      summary: Health, counts and attention items. Screen E1.
      security: [{session: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: {type: string}
                  update_available: {type: string}
                  storage: {type: object, properties: {used: {type: integer}, disk_total: {type: integer}, disk_free: {type: integer}}}
                  live: {type: object, properties: {secrets: {type: integer}, requests: {type: integer}, expiring_today: {type: integer}}}
                  week: {type: object, properties: {created: {type: integer}, senders: {type: integer}}}
                  cleanup: {type: object, properties: {last_run: {$ref: '#/components/schemas/Time'}, removed: {type: integer}}}
                  attention: {type: array, items: {type: object, properties: {code: {type: string}, level: {type: string, enum: [info, warn, error]}, message: {type: string}, action: {type: string}}}}
                  recent: {type: array, items: {$ref: '#/components/schemas/Event'}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /server/access:
    get: {tags: [Server], summary: Screen E2, security: [{session: []}], responses: {'200': {description: OK}}}
    put:
      tags: [Server]
      summary: Change who can create links. Needs re-auth.
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {mode: {type: string, enum: [anyone, signed_in]}}}}}}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /server/users:
    get: {tags: [Server], summary: "People who have signed in, with role and 2FA", security: [{session: []}], responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/User'}}}}}}}}}
  /server/users/{user_id}:
    patch:
      tags: [Server]
      summary: Promote to owner or demote. Needs re-auth. The last owner can't be demoted.
      security: [{session: []}]
      parameters: [{name: user_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {role: {type: string, enum: [member, owner]}}}}}}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '409': {$ref: '#/components/responses/Conflict'}}
  /server/limits:
    get: {tags: [Server], summary: Screen E3. Each value says whether an env var locks it., security: [{session: []}], responses: {'200': {description: OK}}}
    put:
      tags: [Server]
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: {type: integer}}}}}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '400': {$ref: '#/components/responses/Invalid'}}
  /server/branding:
    get: {tags: [Server], summary: Screen E4, security: [{session: []}], responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Brand'}}}}}}
    put: {tags: [Server], security: [{session: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Brand'}}}}, responses: {'204': {$ref: '#/components/responses/NoContent'}}}
  /server/branding/logo:
    put:
      tags: [Server]
      summary: Upload a logo (SVG sanitized server-side, or PNG at least 64 px; max 256 KB)
      security: [{session: []}]
      requestBody: {required: true, content: {image/svg+xml: {schema: {type: string, format: binary}}, image/png: {schema: {type: string, format: binary}}}}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '400': {$ref: '#/components/responses/Invalid'}}
    delete: {tags: [Server], security: [{session: []}], responses: {'204': {$ref: '#/components/responses/NoContent'}}}
  /server/notifications:
    get: {tags: [Server], summary: Screen E5 (SMTP status comes from env; secrets are never returned), security: [{session: []}], responses: {'200': {description: OK}}}
  /server/notifications/test-email:
    post: {tags: [Server], security: [{session: []}], requestBody: {content: {application/json: {schema: {type: object, properties: {to: {type: string}}}}}}, responses: {'204': {$ref: '#/components/responses/NoContent'}, '400': {$ref: '#/components/responses/Invalid'}}}
  /server/webhooks:
    get: {tags: [Server], security: [{session: []}], responses: {'200': {description: OK}}}
    post:
      tags: [Server]
      summary: Add a webhook; returns its signing secret once
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [url], properties: {url: {type: string, format: uri}, events: {type: array, items: {type: string}}}}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {type: object, properties: {id: {type: string}, signing_secret: {type: string}}}}}}}
  /server/webhooks/{webhook_id}:
    delete:
      tags: [Server]
      security: [{session: []}]
      parameters: [{name: webhook_id, in: path, required: true, schema: {type: string}}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /server/tokens:
    get: {tags: [Tokens], summary: All tokens on the server (owners). Screen E6., security: [{session: []}], responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Token'}}}}}}}}}
  /me/tokens:
    get: {tags: [Tokens], summary: The caller's own tokens, security: [{session: []}], responses: {'200': {description: OK}}}
    post:
      tags: [Tokens]
      summary: Create a token; the raw value is returned once. Screen E8.
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name, scopes], properties: {name: {type: string, maxLength: 64}, scopes: {type: array, items: {type: string, enum: [send, request]}}, expires_in_days: {type: integer, default: 90, maximum: 365}}}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Token'}, {type: object, properties: {token: {type: string}}}]}}}}}
  /tokens/{token_id}:
    delete:
      tags: [Tokens]
      summary: Revoke (own token, or any token for owners)
      security: [{session: []}]
      parameters: [{name: token_id, in: path, required: true, schema: {type: string}}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '404': {$ref: '#/components/responses/NotFound'}}
  /server/audit:
    get:
      tags: [Server]
      summary: Audit events, newest first. Screen E7.
      security: [{session: []}]
      parameters:
        - {name: type, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}, description: Person email or item ID}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: cursor, in: query, schema: {type: string}}
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Event'}}, next: {type: string}}}}}}}
  /server/audit.csv:
    get: {tags: [Server], security: [{session: []}], responses: {'200': {description: CSV, content: {text/csv: {schema: {type: string}}}}}}

  /me/receipts/{item_id}:
    delete:
      tags: [Receipts]
      summary: Detach a receipt from the account (the item itself is untouched)
      security: [{session: []}]
      parameters: [{name: item_id, in: path, required: true, schema: {type: string}}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /me/password:
    put:
      tags: [Auth]
      summary: Change your password (password owners). Signs out your other sessions.
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [current, new], properties: {current: {type: string}, new: {type: string, minLength: 12}}}}}}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '400': {$ref: '#/components/responses/Invalid'}}
  /me/totp:
    post:
      tags: [Auth]
      summary: Start 2FA setup; returns a new secret and otpauth URI (not saved yet)
      security: [{session: []}]
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {secret: {type: string}, uri: {type: string}}}}}}}
    put:
      tags: [Auth]
      summary: Turn on 2FA with the secret and a current code. Needs re-auth.
      security: [{session: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [secret, code], properties: {secret: {type: string}, code: {type: string}}}}}}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '403': {$ref: '#/components/responses/Forbidden'}}
    delete:
      tags: [Auth]
      summary: Turn off 2FA. Needs re-auth.
      security: [{session: []}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /demo/challenge:
    get:
      tags: [Config]
      summary: "DEMO=true only: a proof-of-work challenge. Send X-PoW: <challenge>:<nonce> where SHA-256 of that string has `bits` leading zero bits."
      responses: {'200': {description: OK, content: {application/json: {schema: {type: object, properties: {challenge: {type: string}, bits: {type: integer}, expires_in: {type: integer}}}}}}, '404': {$ref: '#/components/responses/NotFound'}}
  /brand/logo:
    get:
      tags: [Config]
      summary: The operator's logo (sanitized SVG or PNG), served with a sandboxing CSP
      responses: {'200': {description: Image}, '404': {$ref: '#/components/responses/NotFound'}}

  /healthz:
    get: {tags: [Health], summary: Liveness and database check (no auth), responses: {'200': {description: OK}, '503': {description: Unhealthy}}}
  /metrics:
    get: {tags: [Health], summary: Prometheus metrics; disabled unless METRICS_TOKEN is set, security: [{bearer: []}], responses: {'200': {description: text/plain}}}
