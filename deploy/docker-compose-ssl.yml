services:
  caddy:
    image: caddy:2-alpine
    container_name: cryptex-caddy
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [cryptex]

  cryptex:
    image: poliuscorp/cryptex
    container_name: cryptex
    restart: unless-stopped
    volumes: ["./data:/data"]

volumes:
  caddy_data:
  caddy_config:
