version: 2
# Every update goes through CI (api, web, e2e, image). Low-risk ones merge themselves once it passes
# (.github/workflows/dependabot-automerge.yml): patch releases, minor releases from 1.0 on, and base-image digest
# refreshes of the same tag. Everything else waits for review.

# @playwright/test (e2e/package.json) and the Playwright image (e2e/compose.yml) must be the same version,
# so they move together in one pull request.
multi-ecosystem-groups:
  e2e:
    schedule:
      interval: "weekly"
    labels: ["dependencies"]

updates:
  # Actions used by CI and releases (pinned by commit SHA; updates keep the SHA and its version comment)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      github-actions:
        patterns: ["*"]

  # API (requirements*.txt, hash-pinned)
  - package-ecosystem: "pip"
    directory: "/api"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      pip-api:
        patterns: ["*"]

  # Web app
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      npm-web:
        patterns: ["*"]

  # End-to-end tests: npm packages and the Playwright image, in one group
  - package-ecosystem: "npm"
    directory: "/e2e"
    patterns: ["*"]
    multi-ecosystem-group: "e2e"
  - package-ecosystem: "docker-compose"
    directory: "/e2e"
    patterns: ["*"]
    multi-ecosystem-group: "e2e"

  # Base images in the Dockerfile (pinned by digest; updates keep the tag and the digest)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      docker:
        patterns: ["*"]
    # Node moves a major by hand, from one LTS to the next, together with node-version in ci.yml (odd majors are
    # never LTS). Patches and the image digest still update here.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
