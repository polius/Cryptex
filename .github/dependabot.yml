version: 2
# Every update goes through CI (api, web, cli, e2e, image). Nothing is merged automatically.
updates:
  # Actions used by CI and releases
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      github-actions:
        patterns: ["*"]

  # API (requirements*.txt, hash-pinned)
  - package-ecosystem: "pip"
    directory: "/api"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      pip-api:
        patterns: ["*"]

  # Web app
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      npm-web:
        patterns: ["*"]

  # End-to-end tests
  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      npm-e2e:
        patterns: ["*"]

  # CLI
  - package-ecosystem: "gomod"
    directory: "/cli"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      gomod-cli:
        patterns: ["*"]

  # Base images in the Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      docker:
        patterns: ["*"]
