name: CI

on:
  push:
    branches: [main, v3]
  pull_request:
  workflow_call:   # release.yml runs the whole suite on the release commit before pushing anything

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

# Actions are pinned by commit SHA; Dependabot keeps the SHAs and the version comments current.
jobs:
  api:
    name: API (lint, tests)
    runs-on: ubuntu-latest
    permissions: { contents: read }
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13", cache: pip, cache-dependency-path: api/requirements-dev.txt }
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check cryptex tests
      - name: Crypto reference vectors verify
        run: python tests/reference.py && git diff --exit-code ../docs/vectors.json
      - name: Tests (permissions, threat model, audit regressions, integrations)
        run: pytest -q

  web:
    name: Web (types, unit tests, build, size budgets)
    runs-on: ubuntu-latest
    permissions: { contents: read }
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Unit tests (crypto vectors, paste parser, copy)
        run: npm test
      - run: npm run build
      - name: Size budgets
        run: npm run size

  e2e:
    name: End to end (Playwright, two browsers, demo, visual)
    runs-on: ubuntu-latest
    permissions: { contents: read }
    needs: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image and start the stack
        run: docker compose -f e2e/compose.yml up -d --build --wait cryptex cryptex-demo
      - name: Playwright
        run: docker compose -f e2e/compose.yml run --rm -e CI=1 playwright
      - name: Container logs
        if: failure()
        run: docker compose -f e2e/compose.yml logs --no-color cryptex cryptex-demo | tail -200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: playwright-report, path: "e2e/playwright-report\ne2e/test-results", retention-days: 7 }

  image:
    name: Container (multi-arch build, smoke test)
    runs-on: ubuntu-latest
    permissions: { contents: read }
    needs: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: { context: ., platforms: "linux/amd64,linux/arm64", push: false, tags: "cryptex:ci" }
      - name: Smoke test (healthy, SPA with CSP, non-root, cryptex command)
        run: |
          docker build -t cryptex:smoke .
          docker run -d --name smoke -p 127.0.0.1:8080:8080 cryptex:smoke
          # The image's health check runs every 2 s while starting (--start-interval).
          for _ in $(seq 30); do test "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy && break; sleep 1; done
          test "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy
          curl -fsS localhost:8080/api/v1/healthz
          # Capture output first: the step runs under bash -e without pipefail, so a failing curl in a pipe would pass.
          headers=$(curl -fsI localhost:8080/s/abcdefghij)
          echo "$headers" | grep -i "content-security-policy: default-src 'self'"
          # The server runs as 10001 (the entrypoint drops root), and so does the cryptex command run with docker exec.
          test "$(docker exec smoke awk '/^Uid:/ {print $2}' /proc/1/status)" = 10001
          out=$(docker exec smoke cryptex owner reset 2>&1 || true)
          echo "$out" | grep "no owners yet"
      - name: Smoke test logs
        if: failure()
        run: docker logs smoke 2>&1 | tail -100 || true
