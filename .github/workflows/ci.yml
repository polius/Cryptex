name: CI

on:
  push:
    branches: [main, v3]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip, cache-dependency-path: api/requirements-dev.txt }
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check cryptex tests
      - name: Crypto reference vectors verify
        run: python ../design/v3/spec/reference.py && git diff --exit-code ../design/v3/spec/vectors.json
      - name: Tests (permissions, threat model, audit regressions, integrations)
        run: pytest -q
      - name: OpenAPI contract is valid
        run: pip install openapi-spec-validator==0.9.0 pyyaml==6.0.3 && python -c "import yaml; from openapi_spec_validator import validate; validate(yaml.safe_load(open('../design/v3/spec/openapi.yaml')))"

  web:
    name: Web (types, unit tests, build, size budgets)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Unit tests (crypto vectors, paste parser, copy)
        run: npm test
      - run: npm run build
      - name: Size budgets (frontend.md §11)
        run: npm run size
      - name: Same vectors as the spec
        run: cmp src/crypto/vectors.json ../design/v3/spec/vectors.json

  cli:
    name: CLI (vectors, tests, integration, cross-compile)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cli } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.25", cache-dependency-path: cli/go.sum }
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - name: API for the integration test
        working-directory: api
        run: python -m venv .venv && .venv/bin/pip install --require-hashes -r requirements.txt
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - name: Integration against a live server
        run: CRYPTEX_IT=1 go test ./cmd/cryptex -run Integration -v
      - name: Cross-compile
        run: |
          for os in linux darwin windows; do for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o /dev/null ./cmd/cryptex
          done; done
      - name: Same vectors as the spec
        run: cmp internal/crypto/testdata/vectors.json ../design/v3/spec/vectors.json

  e2e:
    name: End to end (Playwright, two browsers, Mailpit, demo, visual)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image and start the stack
        run: docker compose -f e2e/compose.yml up -d --build --wait cryptex cryptex-demo mailpit
      - name: Playwright
        run: docker compose -f e2e/compose.yml run --rm -e CI=1 playwright
      - name: Container logs
        if: failure()
        run: docker compose -f e2e/compose.yml logs --no-color cryptex cryptex-demo | tail -200
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: "e2e/playwright-report\ne2e/test-results", retention-days: 7 }

  image:
    name: Container (multi-arch build, smoke test)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build amd64 and arm64
        uses: docker/build-push-action@v7
        with: { context: ., platforms: "linux/amd64,linux/arm64", push: false, tags: "cryptex:ci" }
      - name: Smoke test (health, headers, non-root API, owner reset command)
        run: |
          docker build -t cryptex:smoke .
          docker run -d --name smoke -p 8080:80 -e SETUP_CODE=SMOKE cryptex:smoke
          for _ in $(seq 30); do curl -fs localhost:8080/api/v1/healthz && break; sleep 1; done
          curl -fsI localhost:8080/s/abcdefghij | grep -qi "content-security-policy: default-src 'self'"
          test "$(docker exec smoke ps -o user,args | grep uvicorn | grep -v grep | awk '{print $1}')" = cryptex
          docker exec smoke cryptex owner reset 2>&1 | grep -q "no owners yet"
