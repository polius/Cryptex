name: Release

on:
  release:
    types: [published]

permissions:
  contents: write      # attach CLI binaries to the release
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    name: Push the container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          username: poliuscorp
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: poliuscorp/cryptex
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: index.docker.io/poliuscorp/cryptex
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  cli:
    name: Build and attach the CLI
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cli } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.25", cache-dependency-path: cli/go.sum }
      - name: Build
        run: |
          mkdir -p dist
          for os in linux darwin windows; do for arch in amd64 arm64; do
            ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X github.com/polius/cryptex/cli/internal/app.Version=${GITHUB_REF_NAME#v}" \
              -o "dist/cryptex-${os}-${arch}${ext}" ./cmd/cryptex
          done; done
          cd dist && sha256sum -- * > SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with: { subject-path: "cli/dist/cryptex-*" }
      - name: Attach to the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
