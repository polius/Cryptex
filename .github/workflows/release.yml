name: Release

on:
  release:
    types: [published]
  # Only the SHA256SUMS of an image a release already pushed (when that step failed): the image isn't built again.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) whose pushed image is hashed
        required: true

permissions: {}

# Actions are pinned by commit SHA; Dependabot keeps the SHAs and the version comments current.
jobs:
  ci:
    name: Full CI on the release commit
    if: github.event_name == 'release'
    permissions: { contents: read }
    uses: ./.github/workflows/ci.yml

  image:
    name: Push the container image
    if: github.event_name == 'release'
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # signs the provenance attestation
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      # Release tags are vX.Y.Z. Anything else fails here, before anything is pushed. Only a release marked as a
      # prerelease may add a suffix (v3.1.0-rc.1): a final release with one would get only its own tag.
      - name: Version from the release tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$TAG" =~ $re ]]; then
            echo "::error::Release tag $TAG isn't vX.Y.Z"; exit 1
          fi
          if [ -n "${BASH_REMATCH[4]}" ] && [ "$PRERELEASE" != true ]; then
            echo "::error::Release tag $TAG has a suffix but the release isn't marked as a prerelease"; exit 1
          fi
          version="${TAG#v}"
          { echo "version=$version"; echo "major=${BASH_REMATCH[1]}"; echo "minor=${BASH_REMATCH[2]}"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: poliuscorp
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: poliuscorp/cryptex
          # A release marked as a prerelease gets only its own version tag, whatever its tag looks like: semver alone
          # would still move {{major}}, {{major}}.{{minor}} and latest for a plain tag.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }},enable=${{ !github.event.release.prerelease }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }},enable=${{ !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
      # metadata-action only warns when it can't read a version, and would push whatever is left.
      - name: Check the image tags (X.Y.Z, plus X.Y, X and latest unless a prerelease)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.version.outputs.version }}
          MAJOR: ${{ steps.version.outputs.major }}
          MINOR: ${{ steps.version.outputs.minor }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          want=("poliuscorp/cryptex:$VERSION")
          if [ "$PRERELEASE" != true ]; then want+=("poliuscorp/cryptex:$MAJOR.$MINOR" "poliuscorp/cryptex:$MAJOR" "poliuscorp/cryptex:latest"); fi
          if ! diff <(printf '%s\n' "${want[@]}" | sort) <(printf '%s\n' "$TAGS" | grep . | sort); then
            echo "::error::The image tags aren't the expected ones (diff above: < expected, > generated)"; exit 1
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/poliuscorp/cryptex
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  web-hashes:
    name: Publish SHA256SUMS of the web files
    needs: [image]
    if: ${{ !cancelled() && (needs.image.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write       # uploads the release asset
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # Run by hand, the image is the one the release's version tag points to.
      - name: The pushed image
        id: image
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$DIGEST" ]; then
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then echo "::error::$TAG isn't vX.Y.Z"; exit 1; fi
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null
            DIGEST=$(docker buildx imagetools inspect "poliuscorp/cryptex:${TAG#v}" --format '{{json .Manifest}}' | jq -r .digest)
          fi
          echo "image=poliuscorp/cryptex@$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Hash the web files of the pushed image (both platforms must match)
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        # The image goes between platforms: a newer Docker won't pull a second platform under the same digest
        # ("cannot overwrite digest").
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker pull -q --platform "$platform" "$IMAGE"
            cid=$(docker create --platform "$platform" "$IMAGE")
            rm -rf web && docker cp "$cid:/usr/share/cryptex/web" web && docker rm "$cid"
            docker rmi "$IMAGE"
            (cd web && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "SHA256SUMS.${platform#linux/}"
          done
          cmp SHA256SUMS.amd64 SHA256SUMS.arm64
          mv SHA256SUMS.amd64 SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
