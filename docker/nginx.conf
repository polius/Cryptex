# Cryptex: static front end + /api proxy. TLS terminates in front of this container.
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  # No IPs or URLs with tokens in access logs: log only method, route class and status.
  map $request_uri $route_class { ~^/api/ api; ~^/assets/ asset; default page; }
  log_format cryptex '$time_iso8601 $request_method $route_class $status $body_bytes_sent $request_time';
  access_log /dev/stdout cryptex;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 512;

  # Coarse safety net only; real limits are per IP and per IPv6 /64 in the app.
  limit_req_zone $binary_remote_addr zone=coarse:10m rate=30r/s;
  map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; '' $scheme; }

  server {
    listen 80;
    listen [::]:80;
    root /usr/share/cryptex/web;
    client_max_body_size 1m;
    absolute_redirect off;

    include /etc/nginx/cryptex-headers.conf;

    location /api/ {
      limit_req zone=coarse burst=200 nodelay;
      limit_req_status 429;
      proxy_pass http://127.0.0.1:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header Connection "";
      proxy_read_timeout 120s;
    }
    # Encrypted chunks are up to 5 MiB + 16 bytes.
    location ~ "^/api/v1/(secrets|requests)/[0-9A-Za-z]{10}/(answer/)?chunks/" {
      client_max_body_size 6m;
      proxy_request_buffering off;
      proxy_pass http://127.0.0.1:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_set_header Connection "";
    }
    location = /api/v1/server/branding/logo {
      client_max_body_size 300k;
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
    # Live updates (SSE): never buffer.
    location = /api/v1/receipts/events {
      proxy_pass http://127.0.0.1:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
    }

    location /assets/ {
      include /etc/nginx/cryptex-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }
    location = /index.html {
      include /etc/nginx/cryptex-headers.conf;
      add_header Cache-Control "no-cache" always;
    }
    location / {
      try_files $uri /index.html;
    }
  }
}
